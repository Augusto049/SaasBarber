<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Noturno / Noir -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Luz Âmbar Suave das Luminárias Vintage -->
    <radialGradient id="lampGlow1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lampGlow2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldLines" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </linearGradient>

    <pattern id="brickPattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 0 L 40 20 L 0 20 Z" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.3" />
      <line x1="20" y1="0" x2="20" y2="20" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="1600" height="600" fill="url(#bannerBg)" />
  <rect width="1600" height="600" fill="url(#brickPattern)" opacity="0.4" />

  <!-- Luzes Quentes Âmbar -->
  <rect width="1600" height="600" fill="url(#lampGlow1)" />
  <rect width="1600" height="600" fill="url(#lampGlow2)" />

  <!-- Padrão Geométrico Art Déco de Barbearia de Luxo -->
  <g stroke="url(#goldLines)" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Linhas Radiais -->
    <line x1="0" y1="600" x2="400" y2="0" />
    <line x1="1600" y1="600" x2="1200" y2="0" />
    <circle cx="800" cy="300" r="280" />
    <circle cx="800" cy="300" r="340" stroke-dasharray="10,15" />
    <circle cx="800" cy="300" r="420" />
  </g>

  <!-- Silhuetas de Cadeiras de Barbeiro Vintage ao Fundo -->
  <g opacity="0.12" fill="#FDE68A">
    <!-- Cadeira 1 (Esquerda) -->
    <path d="M 250 550 L 310 550 L 305 480 L 320 480 L 325 430 L 290 430 L 290 350 L 270 350 L 270 430 L 235 430 L 240 480 L 255 480 Z" />
    <ellipse cx="280" cy="340" rx="30" ry="15" />
    <!-- Cadeira 2 (Direita) -->
    <path d="M 1310 550 L 1370 550 L 1365 480 L 1380 480 L 1385 430 L 1350 430 L 1350 350 L 1330 350 L 1330 430 L 1295 430 L 1300 480 L 1315 480 Z" />
    <ellipse cx="1340" cy="340" rx="30" ry="15" />
  </g>

  <!-- Poste de Barbeiro (Barber Pole) Estilizado Brilhante no Canto Direito -->
  <g transform="translate(1420, 180) scale(0.85)" opacity="0.35">
    <!-- Cúpula de Vidro -->
    <rect x="-25" y="-140" width="50" height="280" rx="25" fill="#0F172A" stroke="#F59E0B" stroke-width="3" />
    <!-- Listras do Barber Pole Vermelho, Azul e Branco -->
    <clipPath id="poleClip">
      <rect x="-24" y="-138" width="48" height="276" rx="24" />
    </clipPath>
    <g clip-path="url(#poleClip)">
      <path d="M -50 -100 L 50 -50 L 50 -20 L -50 -70 Z" fill="#EF4444" opacity="0.7" />
      <path d="M -50 -40 L 50 10 L 50 40 L -50 -10 Z" fill="#3B82F6" opacity="0.7" />
      <path d="M -50 20 L 50 70 L 50 100 L -50 50 Z" fill="#EF4444" opacity="0.7" />
      <path d="M -50 80 L 50 130 L 50 160 L -50 110 Z" fill="#3B82F6" opacity="0.7" />
    </g>
    <!-- Tampas Douradas Metálicas -->
    <circle cx="0" cy="-145" r="18" fill="#F59E0B" />
    <circle cx="0" cy="145" r="18" fill="#F59E0B" />
  </g>

  <!-- Brilhos Bokeh Dourados no Ar -->
  <circle cx="350" cy="180" r="6" fill="#FDE68A" opacity="0.6" filter="blur(2px)" />
  <circle cx="480" cy="240" r="12" fill="#F59E0B" opacity="0.3" filter="blur(4px)" />
  <circle cx="1150" cy="160" r="8" fill="#FDE68A" opacity="0.5" filter="blur(3px)" />
  <circle cx="1250" cy="280" r="14" fill="#F59E0B" opacity="0.35" filter="blur(5px)" />
  <circle cx="750" cy="120" r="5" fill="#FEF3C7" opacity="0.7" />

  <!-- Linha Dourada de Rodapé -->
  <line x1="0" y1="596" x2="1600" y2="596" stroke="url(#goldLines)" stroke-width="4" />
</svg>
