<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Metálico -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Gradiente Dourado Claro para Brilhos -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gradiente de Fundo Escuro Nobre -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Sombra e Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular com Borda Dupla Dourada -->
  <circle cx="250" cy="250" r="235" fill="url(#darkBg)" stroke="url(#goldGradient)" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Coroa no Topo -->
  <g transform="translate(250, 105) scale(0.9)" filter="url(#goldGlow)">
    <path d="M -45 15 L -55 -15 L -25 -2 L 0 -25 L 25 -2 L 55 -15 L 45 15 Z" fill="url(#goldGradient)" />
    <circle cx="-55" cy="-18" r="4" fill="#FEF3C7" />
    <circle cx="0" cy="-28" r="5" fill="#FEF3C7" />
    <circle cx="55" cy="-18" r="4" fill="#FEF3C7" />
    <rect x="-42" y="16" width="84" height="6" rx="3" fill="url(#goldLight)" />
  </g>

  <!-- Tesoura Estilizada Cruzada com Navalha Clássica -->
  <!-- Lâmina 1 da Tesoura -->
  <g transform="translate(250, 245) rotate(-35)">
    <!-- Olhal da tesoura -->
    <ellipse cx="-85" cy="0" rx="22" ry="32" fill="none" stroke="url(#goldGradient)" stroke-width="8" />
    <!-- Haste e Lâmina -->
    <path d="M -63 -4 C -20 -4, 20 -3, 110 -1 C 50 -12, -20 -8, -63 -4 Z" fill="url(#goldLight)" />
  </g>

  <!-- Lâmina 2 da Tesoura -->
  <g transform="translate(250, 245) rotate(35)">
    <!-- Olhal da tesoura -->
    <ellipse cx="-85" cy="0" rx="22" ry="32" fill="none" stroke="url(#goldGradient)" stroke-width="8" />
    <!-- Haste e Lâmina -->
    <path d="M -63 4 C -20 4, 20 3, 110 1 C 50 12, -20 8, -63 4 Z" fill="url(#goldLight)" />
  </g>

  <!-- Pino central da tesoura (Ponto focal) -->
  <circle cx="250" cy="245" r="10" fill="url(#goldLight)" stroke="#0F172A" stroke-width="3" />

  <!-- Navalhete Clássico Dobrável no Centro -->
  <g transform="translate(250, 275)">
    <!-- Cabo da Navalha -->
    <path d="M -80 35 C -40 45, 40 45, 80 35 C 70 28, -70 28, -80 35 Z" fill="url(#goldGradient)" opacity="0.9" />
    <!-- Lâmina Reta de Aço Nobre -->
    <path d="M -70 10 L 70 10 L 65 -5 L -65 -5 Z" fill="url(#goldLight)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <!-- Encaixe de articulação da navalha -->
    <circle cx="-68" cy="10" r="4" fill="#0F172A" stroke="url(#goldLight)" stroke-width="1.5" />
  </g>

  <!-- Faixa de Texto Decorativa com Tipografia Imponente -->
  <!-- Fita / Ribbon -->
  <g transform="translate(250, 375)">
    <path d="M -150 -5 L -175 -20 L -150 -35 L 150 -35 L 175 -20 L 150 -5 Z" fill="#0F172A" stroke="url(#goldGradient)" stroke-width="2" />
    <!-- Dobras da Fita -->
    <path d="M -150 -5 L -150 -20 L -130 -5 Z" fill="#92400E" />
    <path d="M 150 -5 L 150 -20 L 130 -5 Z" fill="#92400E" />
    <!-- Texto BARBERSAAS -->
    <text x="0" y="-14" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="22" fill="url(#goldLight)" text-anchor="middle" letter-spacing="4">
      BARBERSAAS
    </text>
  </g>

  <!-- Estrelas de Avaliação 5 Estrelas -->
  <g transform="translate(250, 420)" fill="url(#goldGradient)">
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-40, 0) scale(1.3)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-20, 0) scale(1.3)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(0, 0) scale(1.6)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(20, 0) scale(1.3)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(40, 0) scale(1.3)" />
  </g>
</svg>
