<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldDeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="domDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
  </defs>

  <!-- Brasão Octogonal / Círculo Duplo -->
  <circle cx="250" cy="250" r="236" fill="url(#domDark)" stroke="url(#goldDeg)" stroke-width="5" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldShine)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Texto Curvo Superior: BARBEARIA TRADICIONAL -->
  <path id="curveTop" d="M 90 250 A 160 160 0 0 1 410 250" fill="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="url(#goldShine)" letter-spacing="5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      BARBEARIA TRADICIONAL
    </textPath>
  </text>

  <!-- Silhueta Elegante do Cavalheiro (Gentleman) com Barba e Penteado Clássico -->
  <g transform="translate(250, 215) scale(1.15)">
    <!-- Cabelo Pompadour / Fade Clássico -->
    <path d="M -40 -60 C -30 -85, 20 -85, 38 -55 C 42 -40, 36 -20, 38 -5 C 28 -8, 20 -15, 10 -15 C -5 -15, -25 -25, -40 -60 Z" fill="url(#goldShine)" />
    <!-- Rosto de Perfil / Três Quartos -->
    <path d="M 38 -5 C 38 10, 34 25, 25 35 C 18 42, 8 48, -5 50 C -25 50, -35 30, -35 10 C -35 -10, -20 -30, -5 -35 C 15 -35, 30 -20, 38 -5 Z" fill="#0F172A" stroke="url(#goldDeg)" stroke-width="2" />
    <!-- Barba Cheia e Bigode Impecável -->
    <path d="M 25 20 C 35 30, 20 65, -5 72 C -30 68, -40 45, -35 25 C -25 30, -10 32, 5 30 C 15 28, 20 22, 25 20 Z" fill="url(#goldDeg)" />
    <!-- Bigode Estilizado -->
    <path d="M 12 18 C 28 14, 38 20, 35 26 C 26 25, 16 23, 8 26 C 2 24, 6 20, 12 18 Z" fill="url(#goldShine)" />
    <!-- Gola da Camisa / Gravata Borboleta -->
    <polygon points="-15,75 0,82 -15,90" fill="url(#goldShine)" />
    <polygon points="15,75 0,82 15,90" fill="url(#goldShine)" />
    <circle cx="0" cy="82" r="3" fill="#FFFBEB" />
  </g>

  <!-- Pente de Madeira e Navalha ao fundo -->
  <g transform="translate(140, 215) rotate(45)" opacity="0.65">
    <rect x="-30" y="-5" width="60" height="10" rx="3" fill="url(#goldDeg)" />
    <line x1="-25" y1="5" x2="-25" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
    <line x1="-15" y1="5" x2="-15" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
    <line x1="-5" y1="5" x2="-5" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
    <line x1="5" y1="5" x2="5" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
    <line x1="15" y1="5" x2="15" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
    <line x1="25" y1="5" x2="25" y2="18" stroke="url(#goldDeg)" stroke-width="2" />
  </g>

  <!-- Placa Central: DOM AUGUSTO -->
  <g transform="translate(250, 370)">
    <!-- Base Dourada -->
    <rect x="-170" y="-30" width="340" height="52" rx="10" fill="#0B0F19" stroke="url(#goldDeg)" stroke-width="3" />
    <rect x="-165" y="-25" width="330" height="42" rx="7" fill="none" stroke="url(#goldShine)" stroke-width="1" opacity="0.5" />
    
    <text x="0" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" fill="url(#goldShine)" text-anchor="middle" letter-spacing="4">
      DOM AUGUSTO
    </text>
    <text x="0" y="29" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#F59E0B" text-anchor="middle" letter-spacing="6">
      EST. 2026 • PREMIUM CLUB
    </text>
  </g>

  <!-- Estrelas Inferiores -->
  <g transform="translate(250, 435)" fill="url(#goldShine)">
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" transform="translate(-30, 0)" />
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" transform="translate(0, 0) scale(1.4)" />
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" transform="translate(30, 0)" />
  </g>
</svg>
